name: flutter_sdk
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

workspace:
  - packages/altcraft_core
  - packages/altcraft_push
  - packages/altcraft_inapp
  - packages/altcraft_target
  - packages/altcraft_profile
  - packages/altcraft_sdk
  - example

dev_dependencies:
  melos: ^8.0.0

melos:
  packages:
    - packages/*
    - example

  scripts:
    analyze:
      description: Run dart analyze in all packages.
      exec: dart analyze .
    test:
      description: Run flutter tests in all packages.
      exec: flutter test
    get:
      description: Run pub get in all packages.
      exec: flutter pub get
