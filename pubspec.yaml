name: altcraft_sdk
description: Flutter SDK for Altcraft push notification platform. Supports Android and iOS with native SDK integration.
version: 1.0.0
homepage: https://github.com/altcraft/altcraft-sdk-flutter
repository: https://github.com/altcraft/altcraft-sdk-flutter
issue_tracker: https://github.com/altcraft/altcraft-sdk-flutter/issues
documentation: https://pub.dev/documentation/altcraft_sdk/
topics: [push-notifications, altcraft, messaging]

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4

flutter:
  plugin:
    platforms:
      android:
        package: com.altcraft.flutter
        pluginClass: AltcraftSdkPlugin
      ios:
        pluginClass: AltcraftSdkPlugin

platforms:
  android:
  ios:
