name: altcraft_sdk_example
description: Example app for the Altcraft SDK Flutter plugin.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  altcraft_core:
    path: ../packages/altcraft_core
  altcraft_push:
    path: ../packages/altcraft_push
  altcraft_inapp:
    path: ../packages/altcraft_inapp
  altcraft_target:
    path: ../packages/altcraft_target
  altcraft_profile:
    path: ../packages/altcraft_profile
  shared_preferences: ^2.3.3
  url_launcher: 6.2.6
  url_launcher_android: 6.3.10
  url_launcher_ios: 6.4.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  config:
    enable-swift-package-manager: true

resolution: workspace
