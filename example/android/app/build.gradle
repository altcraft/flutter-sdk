plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

dependencies {
     implementation(platform("com.google.firebase:firebase-bom:33.4.0"))
     implementation("com.google.firebase:firebase-messaging")
     // Native Altcraft SDK modules used directly by the application code
     // (MainApplication registers push providers, JWTProvider implements
     // the native JWT interface). The Flutter plugin packages resolve
     // their own native dependencies.
     implementation("com.altcraft:android-sdk-core:1.0.1")
     implementation("com.altcraft:android-sdk-inapp:1.0.1")
     implementation("com.altcraft:android-sdk-push:1.0.1")
}

flutter {
    source = "../.."
}

android {
    namespace = "com.altcraft.flutter.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.altcraft.flutter.app"
        minSdkVersion = 25
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}