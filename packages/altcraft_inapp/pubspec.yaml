name: altcraft_inapp
description: >-
  In-App module of the Altcraft Flutter SDK: In-App subscriptions, screen
  tracking, triggers, and placements. Depends on altcraft_core.
version: 1.0.0
homepage: https://github.com/altcraft/flutter-sdk
repository: https://github.com/altcraft/flutter-sdk/tree/main/packages/altcraft_inapp
issue_tracker: https://github.com/altcraft/flutter-sdk/issues
documentation: https://guides.altcraft.com/developer-guide/sdk/mobile/flutter/
topics:
  - push-notifications
  - altcraft
  - messaging

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  altcraft_core: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4

flutter:
  plugin:
    platforms:
      android:
        package: com.altcraft.flutter.inapp
        pluginClass: AltcraftInAppPlugin
      ios:
        pluginClass: AltcraftInAppPlugin

resolution: workspace
